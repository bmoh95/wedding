name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site/assets _site/data
          shopt -s nullglob
          cp -f .nojekyll README.md *.html wedding.ics _site/
          cp -f assets/*.css assets/*.js assets/*.json assets/*.mp3 assets/wedding-gallery-sample-*.svg assets/wedding-cover-*.jpg _site/assets/
          if [ -d assets/vendor ]; then
            cp -R assets/vendor _site/assets/vendor
          fi
          cp -f data/*.json _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
